name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    name: test (PHP ${{ matrix.php-version }}, PHPCS ${{ matrix.phpcs }})

    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.3']
        phpcs: ['3', '4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Install dependencies (PHPCS ${{ matrix.phpcs }}.x)
        run: composer update --no-interaction --prefer-dist --with "squizlabs/php_codesniffer:^${{ matrix.phpcs }}"

      - name: Show PHPCS version
        run: vendor/bin/phpcs --version

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Run fixture suite
        run: composer test

      - name: Check sniff docs
        run: composer test:docs
